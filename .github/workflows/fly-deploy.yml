# Deploy to Fly on every push to the working branch (add main here once the PR is merged).
# Needs the repo secret FLY_API_TOKEN: `fly tokens create deploy -a <app>` (a repo admin adds it).
name: Deploy to Fly
on:
  push:
    branches: [feat/dashboard-services]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # One Machine only: the reminder scheduler runs in-process and must not run twice.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
